app:
  temp_dir: temp
  logs_dir: logs

data:
  repo_dir: data

queue:
  repo_dir: queue
  repo_url: "git@github.com:your-username/your-queue-repo.git"  # Colab 自动克隆队列仓库的地址
  manual_dir: manual  # client manual 使用的独立队列子目录
  pending_dir: pending
  claimed_dir: claimed
  results_dir: results
  done_dir: done
  failed_dir: failed
  git_timeout: 30  # Git 同步操作超时时间(秒)，默认 30

site:
  repo_dir: site
  base_url: "https://your-username.github.io/bilibili-notes/"
  title: "Bilibili 视频笔记与 AI 总结"
  author: "bilibili2txt"
  theme: "PaperMod"

bilibili:
  target_groups:
    - 默认分组
  target_favorites:
    - 稍后再看  # 收藏夹名称列表（仅提取转写与生成总结，保留在收藏夹中不删除）
  request_interval: 3
  scrape_duration_max: 7200
  test_url: "https://www.bilibili.com/video/BV1v49YBHESJ"  # 客户端环境检查时的测试视频地址

webdav:
  url: https://your-webdav-server.example/dav/
  username: your_username
  password_env: B2T_WEBDAV_PASSWORD
  upload_split_size_mb: 50  # 文件大于此大小(MB)时自动拆分上传，0表示不拆分
  max_retries: 5  # 上传失败重试次数，默认5次
  min_upload_speed_kb: 100  # 环境检查测试上传时的最低速度阈值 (KB/s)

client:
  local_download_audio_seconds: 1800
  netdisk_dir: D:/Netdisk
  proxy: ""
  wait_interval_seconds: 60
  wait_timeout_seconds: 0
  dingtalk:
    enabled: false
    webhook: "https://oapi.dingtalk.com/robot/send?access_token=your_access_token"
    secret: "your_secret_here"  # Optional, if set it uses signature verification

server:
  server_id: colab-a
  git_email: ""  # 可选，Colab 提交队列时的 Git 邮箱（默认 <server_id>@users.noreply.github.com）
  ssh_key_path: ""  # 可选，Colab 环境挂载后用于访问私有 Git 仓库的私钥路径（如 /content/drive/MyDrive/your_id_ed25519）
  git_ssh_user: "git"  # 可选，GitHub SSH 用户名（默认 git）
  engine: funasr  # funasr or whisper
  faster_whisper_path: /content/drive/MyDrive/Faster-Whisper-XXL/faster-whisper-xxl
  max_duration_seconds: 864000
  claim_timeout_minutes: 180
  max_tasks: 0
  funasr:
    drive_model_path: /content/drive/MyDrive/modelscope_cache
    asr_model: speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch
    vad_model: speech_fsmn_vad_zh-cn-16k-common-pytorch
    punc_model: punc_ct-transformer_cn-en-common-vocab471067-large

colab:
  gpu: T4
  notebook: notebooks/bilibili2txt_server_colab.ipynb
  manual_notebook: notebooks/bilibili2txt_server_colab_manual.ipynb
  bookmark_config: ../python_utils_private/open_chrome_bookmark_config.yaml
  command_timeout_seconds: 30  # new/status/stop/whoami 的超时；notebook 执行不限制
  # 每个账号是 WSL 里的一个用户名，通过 wsl.exe -u <name> 切换用户执行
  accounts:
    - name: account-a
    - name: account-b

ai:
  selected: example
  providers:
    - name: example
      enable: true
      api_key: "your-openai-api-key"
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
      interval: 12

